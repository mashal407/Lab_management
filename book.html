<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Resource - Lab Booking System</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="dashboard.html">Lab Booking System</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="dashboard.html">Dashboard</a>
        <a class="nav-link active" href="book.html">Book Resource</a>
        <a class="nav-link" href="my-bookings.html">My Bookings</a>
        <a class="nav-link text-danger" href="#" onclick="logout()">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card shadow-sm">
          <div class="card-body">
            <h3 class="card-title mb-4">Book a Lab or Equipment</h3>
            
            <div id="alertBox"></div>

            <form id="bookingForm">
              <div class="mb-3">
                <label class="form-label">Resource Type</label>
                <select id="resourceType" class="form-select" required onchange="loadResources()">
                  <option value="">Select Type...</option>
                  <option value="lab">Lab</option>
                  <option value="equipment">Equipment</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label">Select Resource</label>
                <select id="resourceId" class="form-select" required>
                  <option value="">Choose type first...</option>
                </select>
              </div>

              <div class="mb-3" id="qtyContainer" style="display: none;">
                <label class="form-label">Quantity</label>
                <input type="number" id="quantity" class="form-control" value="1" min="1">
              </div>

              <div class="mb-3">
                <label class="form-label">Start Time</label>
                <input type="datetime-local" id="startTime" class="form-control" required>
              </div>

              <div class="mb-3">
                <label class="form-label">End Time</label>
                <input type="datetime-local" id="endTime" class="form-control" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Purpose / Project Description</label>
                <textarea id="purpose" class="form-control" rows="3" required placeholder="e.g., Final year project experiment session"></textarea>
              </div>

              <button type="submit" class="btn btn-primary w-100">Submit Booking Request</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Initialize Supabase
    const SUPABASE_URL = "https://ztkxkkpddtqutskjngia.supabase.co";
    const SUPABASE_KEY = "sb_publishable_M70P-kbGsjZ6Lgpb9BeB1w_Iz6NxORm";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const user = JSON.parse(localStorage.getItem('user'));
    if (!user) { location.href = 'index.html'; }

    function logout() {
      localStorage.removeItem('user');
      location.href = 'index.html';
    }

    async function loadResources() {
      const type = document.getElementById('resourceType').value;
      const resourceSelect = document.getElementById('resourceId');
      const qtyContainer = document.getElementById('qtyContainer');
      resourceSelect.innerHTML = '<option value="">Loading...</option>';

      if (!type) {
        resourceSelect.innerHTML = '<option value="">Choose type first...</option>';
        qtyContainer.style.display = 'none';
        return;
      }

      if (type === 'equipment') {
        qtyContainer.style.display = 'block';
        const { data } = await db.from('equipment').select('id, name, available_qty');
        resourceSelect.innerHTML = data.map(eq => `<option value="${eq.id}">${eq.name} (Available: ${eq.available_qty})</option>`).join('');
      } else {
        qtyContainer.style.display = 'none';
        const { data } = await db.from('labs').select('id, name, capacity');
        resourceSelect.innerHTML = data.map(lab => `<option value="${lab.id}">${lab.name} (Capacity: ${lab.capacity})</option>`).join('');
      }
    }

    async function checkConflict(labId, start, end) {
      const { data } = await db.from('bookings').select('*')
        .eq('resource_type', 'lab').eq('resource_id', labId)
        .in('status', ['Pending Approval', 'Approved', 'Reserved', 'In Use'])
        .lt('start_time', end).gt('end_time', start);
      return data;
    }

    document.getElementById('bookingForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alertBox');
      alertBox.innerHTML = '';

      const type = document.getElementById('resourceType').value;
      const resourceId = parseInt(document.getElementById('resourceId').value);
      const quantity = parseInt(document.getElementById('quantity').value) || 1;
      
      const startInput = document.getElementById('startTime').value;
      const endInput = document.getElementById('endTime').value;
      
      const startDate = new Date(startInput);
      const endDate = new Date(endInput);

      // 1. Validate chronological order
      if (startDate >= endDate) {
        alertBox.innerHTML = `<div class="alert alert-danger">End time must be after start time.</div>`;
        return;
      }

      // 2. Enforce Booking Rule: Max 4 hours duration
      const durationHours = (endDate - startDate) / (1000 * 60 * 60);
      if (durationHours > 4) {
        alertBox.innerHTML = `<div class="alert alert-danger">Booking rule violation: Maximum allowed duration is 4 hours.</div>`;
        return;
      }

      // 3. Fix Timezone Shift: Convert local time values to ISO strings
      const startTime = startDate.toISOString();
      const endTime = endDate.toISOString();

      if (type === 'equipment') {
        const { data: eq } = await db.from('equipment').select('available_qty').eq('id', resourceId).single();
        if (quantity > eq.available_qty) {
          alertBox.innerHTML = `<div class="alert alert-warning">Only ${eq.available_qty} units are currently available.</div>`;
          return;
        }
      }

      if (type === 'lab') {
        const conflicts = await checkConflict(resourceId, startTime, endTime);
        if (conflicts.length > 0) {
          // Intelligent Feature: Suggesting next available slot / alternative resolution
          const conflictEnd = new Date(conflicts[0].end_time).toLocaleTimeString();
          alertBox.innerHTML = `
            <div class="alert alert-warning">
              <strong>Conflict Detected!</strong> This lab is already booked during this time slot.<br>
              <em>Intelligent Suggestion:</em> Try booking after <strong>${conflictEnd}</strong> or select a different lab.
            </div>`;
          return;
        }
      }

      // 4. Secure text handling against XSS injection
      const rawPurpose = document.getElementById('purpose').value;
      const safePurpose = document.createElement('div');
      safePurpose.textContent = rawPurpose;

      const { error } = await db.from('bookings').insert([{
        user_id: user.id, 
        resource_type: type, 
        resource_id: resourceId,
        quantity: quantity, 
        start_time: startTime, 
        end_time: endTime,
        purpose: safePurpose.innerHTML, 
        status: 'Pending Approval'
      }]);

      if (error) {
        alertBox.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
      } else {
        alertBox.innerHTML = `<div class="alert alert-success">Booking submitted successfully! Redirecting...</div>`;
        setTimeout(() => location.href = 'my-bookings.html', 1500);
      }
    });
  </script>
</body>
</html>
