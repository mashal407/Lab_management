<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Lab Booking System</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-light d-flex align-items-center py-5" style="min-height: 100vh;">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-sm border-0 rounded-4">
          <div class="card-body p-4 p-sm-5">
            <div class="text-center mb-4">
              <h3 class="fw-bold">Lab Booking System</h3>
              <p class="text-muted">Sign in to your account</p>
            </div>

            <div id="alertBox"></div>

            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" id="email" class="form-control" required placeholder="name@example.com">
              </div>

              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" required placeholder="Password">
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Sign In</button>
              
              <div class="text-center">
                <small class="text-muted">Don't have an account? <a href="register.html">Register here</a></small>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ztkxkkpddtqutskjngia.supabase.co";
    const SUPABASE_KEY = "sb_publishable_M70P-kbGsjZ6Lgpb9BeB1w_Iz6NxORm";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Redirect if already logged in
    if (localStorage.getItem('user')) {
      location.href = 'dashboard.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alertBox');
      alertBox.innerHTML = '';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      // Query the users table for matching credentials
      const { data, error } = await db.from('users')
        .select('*')
        .eq('email', email)
        .eq('password', password)
        .single();

      if (error || !data) {
        alertBox.innerHTML = `<div class="alert alert-danger">Invalid email or password. Please try again.</div>`;
      } else {
        // Save user session
        localStorage.setItem('user', JSON.stringify(data));
        alertBox.innerHTML = `<div class="alert alert-success">Login successful! Redirecting...</div>`;
        setTimeout(() => {
          location.href = 'dashboard.html';
        }, 1000);
      }
    });
  </script>
</body>
</html>
