<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Lab Booking System</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-light d-flex align-items-center py-5" style="min-height: 100vh;">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-sm border-0 rounded-4">
          <div class="card-body p-4 p-sm-5">
            <div class="text-center mb-4">
              <h3 class="fw-bold">Create Account</h3>
              <p class="text-muted">Register for the Lab Booking System</p>
            </div>

            <div id="alertBox"></div>

            <form id="registerForm">
              <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" id="name" class="form-control" required placeholder="John Doe">
              </div>

              <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" id="email" class="form-control" required placeholder="name@example.com">
              </div>

              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" required placeholder="Password">
              </div>

              <div class="mb-3">
                <label class="form-label">Role</label>
                <select id="role" class="form-select" required>
                  <option value="student">Student</option>
                  <option value="staff">Staff</option>
                  <option value="coordinator">Coordinator</option>
                  <option value="admin">Admin</option>
                </select>
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Register</button>
              
              <div class="text-center">
                <small class="text-muted">Already have an account? <a href="index.html">Login here</a></small>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ztkxkkpddtqutskjngia.supabase.co";
    const SUPABASE_KEY = "sb_publishable_M70P-kbGsjZ6Lgpb9BeB1w_Iz6NxORm";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alertBox');
      alertBox.innerHTML = '';

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;

      const { error } = await db.from('users').insert([{ name, email, password, role }]);

      if (error) {
        alertBox.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
      } else {
        alertBox.innerHTML = `<div class="alert alert-success">Registration successful! Redirecting to login...</div>`;
        setTimeout(() => {
          location.href = 'index.html';
        }, 1500);
      }
    });
  </script>
</body>
</html>
