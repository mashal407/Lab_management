<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Panel - Lab Booking System</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="dashboard.html">Lab Booking System (Staff)</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="dashboard.html">Dashboard</a>
        <a class="nav-link" href="book.html">Book Resource</a>
        <a class="nav-link" href="my-bookings.html">My Bookings</a>
        <a class="nav-link active" href="staff.html">Staff Panel</a>
        <a class="nav-link text-danger" href="#" onclick="logout()">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <h2 class="mb-4">Staff Management & Approval Panel</h2>
    
    <div id="alertBox"></div>

    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="card-title mb-3">All User Bookings</h4>
        <div class="table-responsive">
          <table class="table table-striped align-middle">
            <thead>
              <tr>
                <th>ID</th>
                <th>Type / Resource</th>
                <th>User</th>
                <th>Time Slot</th>
                <th>Purpose</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="staffTableBody">
              <tr><td colspan="7" class="text-center">Loading requests...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ztkxkkpddtqutskjngia.supabase.co";
    const SUPABASE_KEY = "sb_publishable_M70P-kbGsjZ6Lgpb9BeB1w_Iz6NxORm";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const user = JSON.parse(localStorage.getItem('user'));
    if (!user || (user.role !== 'staff' && user.role !== 'admin')) {
      alert('Access denied! Staff or Admin privileges required.');
      location.href = 'index.html';
    }

    function logout() {
      localStorage.removeItem('user');
      location.href = 'index.html';
    }

    async function loadAllBookings() {
      // Fetch bookings, users, labs, and equipment to resolve names cleanly
      const [bookingsRes, usersRes, labsRes, eqRes] = await Promise.all([
        db.from('bookings').select('*').order('created_at', { ascending: false }),
        db.from('users').select('id, name'),
        db.from('labs').select('id, name'),
        db.from('equipment').select('id, name')
      ]);

      const tbody = document.getElementById('staffTableBody');
      if (bookingsRes.error) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger">Error: ${bookingsRes.error.message}</td></tr>`;
        return;
      }

      const bookings = bookingsRes.data;
      if (bookings.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted">No booking requests found.</td></tr>`;
        return;
      }

      // Create lookup maps for fast name resolution
      const userMap = {};
      (usersRes.data || []).forEach(u => userMap[u.id] = u.name);

      const labMap = {};
      (labsRes.data || []).forEach(l => labMap[l.id] = l.name);

      const eqMap = {};
      (eqRes.data || []).forEach(e => eqMap[e.id] = e.name);

      tbody.innerHTML = bookings.map(b => {
        const userName = userMap[b.user_id] || `User #${b.user_id}`;
        const resourceName = b.resource_type === 'lab' 
          ? (labMap[b.resource_id] || `Lab #${b.resource_id}`)
          : (eqMap[b.resource_id] || `Equipment #${b.resource_id}`);

        return `
          <tr>
            <td>#${b.id}</td>
            <td>
              <span class="badge bg-secondary text-uppercase">${b.resource_type}</span><br>
              <strong>${resourceName}</strong>
            </td>
            <td>${userName}</td>
            <td>${new Date(b.start_time).toLocaleString()}<br><small class="text-muted">to ${new Date(b.end_time).toLocaleString()}</small></td>
            <td>${b.purpose} <br><small class="text-muted">Qty: ${b.quantity}</small></td>
            <td><span class="badge bg-${getStatusColor(b.status)}">${b.status}</span></td>
            <td>
              <div class="btn-group-vertical btn-group-sm">
                ${b.status === 'Pending Approval' ? `
                  <button class="btn btn-success mb-1" onclick="updateStatus(${b.id}, 'Approved',${b.resource_id}, ${b.quantity}, '${b.resource_type}')">Approve</button>
                  <button class="btn btn-danger" onclick="updateStatus(${b.id}, 'Rejected',${b.resource_id}, ${b.quantity}, '${b.resource_type}')">Reject</button>
                ` : ''}
                ${b.status === 'Approved' ? `
                  <button class="btn btn-primary mb-1" onclick="updateStatus(${b.id}, 'In Use')">Mark In Use / Issue</button>
                ` : ''}
                ${b.status === 'In Use' ? `
                  <button class="btn btn-info text-white" onclick="completeBooking(${b.id},${b.resource_id}, ${b.quantity}, '${b.resource_type}')">Complete / Return</button>
                ` : ''}
                ${b.status !== 'Pending Approval' && b.status !== 'Approved' && b.status !== 'In Use' ? `
                  <span class="text-muted small">No actions</span>
                ` : ''}
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function getStatusColor(status) {
      switch(status) {
        case 'Approved': return 'success';
        case 'Pending Approval': return 'warning text-dark';
        case 'Rejected': return 'danger';
        case 'Cancelled': return 'secondary';
        case 'In Use': return 'primary';
        case 'Completed': return 'info';
        default: return 'dark';
      }
    }

    async function updateStatus(bookingId, newStatus, resourceId, quantity, type) {
      if (newStatus === 'Approved' && type === 'equipment') {
        const { data: eq } = await db.from('equipment').select('available_qty').eq('id', resourceId).single();
        if (eq.available_qty < quantity) {
          alert(`Cannot approve! Only ${eq.available_qty} units available.`);
          return;
        }
        await db.from('equipment').update({ available_qty: eq.available_qty - quantity }).eq('id', resourceId);
      }

      const { error } = await db.from('bookings')
        .update({ status: newStatus, approved_by: user.id })
        .eq('id', bookingId);

      if (error) {
        alert('Error updating status: ' + error.message);
      } else {
        loadAllBookings();
      }
    }

    async function completeBooking(bookingId, resourceId, quantity, type) {
      if (type === 'equipment') {
        const { data: eq } = await db.from('equipment').select('available_qty, total_qty').eq('id', resourceId).single();
        const newQty = Math.min(eq.total_qty, eq.available_qty + quantity);
        await db.from('equipment').update({ available_qty: newQty }).eq('id', resourceId);
      }

      const { error } = await db.from('bookings')
        .update({ status: 'Completed', returned_at: new Date().toISOString() })
        .eq('id', bookingId);

      if (error) {
        alert('Error completing booking: ' + error.message);
      } else {
        loadAllBookings();
      }
    }

    loadAllBookings();
  </script>
</body>
</html>
